apiVersion: apps/v1
kind: Deployment
metadata:
  name: index-builder
spec:
  replicas: 1
  selector:
    matchLabels: {app: index-builder}
  template:
    metadata:
      labels: {app: index-builder}
    spec:
      containers:
        - name: builder
          image: python:3.11-slim
          command: [pyhton, -m, http.server, "8080"]
