apiVersion: v1
kind: ConfigMap
metadata:
  name: log-agent-config
data:
  agent.yml: |
    inputs: [/var/log/containers]
    output: stdout
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
spec:
  selector:
    matchLabels: {app: log-agent}
  template:
    metadata:
      labels: {app: log-agent}
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: [sh, -c, "cat /etc/agent/agent.yaml && sleep 3600"]
          volumeMounts:
            - {name: config, mountPath: /etc/agent}
      volumes:
        - name: config
          configMap:
            name: log-agent-config
            items:
              - {key: agent.yaml, path: agent.yaml}
