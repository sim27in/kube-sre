apiVersion: v1
kind: Service
metadata:
  name: payments
spec:
  selector: {app: payments}
  ports: [{port: 8080, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
spec:
  replicas: 0
  selector:
    matchLabels: {app: payments}
  template:
    metadata:
      labels: {app: payments}
    spec:
      containers:
        - name: payments
          image: nginx:1.27-alpine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout-api}
  template:
    metadata:
      labels: {app: checkout-api}
    spec:
      containers:
        - name: api
          image: python:3.11-slim
          command:
            - python
            - -u
            - -c
            - |
              import sys, time, urllib.request
              print("checkout-api 3.2.0 starting", flush=True)
              for attempt in range(1, 4):
                  try:
                      urllib.request.urlopen("http://payments:8080/", timeout=3)
                      break
                  except Exception as e:
                      print(f"payments check {attempt}/3 failed: {e}", flush=True)
                      time.sleep(1)
              else:
                  print("payments service unreachable, refusing to start", flush=True)
                  sys.exit(1)
