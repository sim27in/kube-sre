apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-site
spec:
  replicas: 2
  selector:
    matchLabels: {app: docs-site}
  template:
    metadata:
      labels: {app: docs-site}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
