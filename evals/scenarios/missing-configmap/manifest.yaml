apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: catalog-api}
  template:
    metadata:
      labels: {app: catalog-api}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          envFrom:
            - configMapRef: {name: catalog-config}
