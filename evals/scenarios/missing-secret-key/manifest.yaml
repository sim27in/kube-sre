apiVersion: v1
kind: Secret
metadata:
  name: billing-db
type: Opaque
stringData:
  username: invoices
  db-pass: example-not-a-real-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-service
spec:
  replicas: 1
  selector:
    matchLabels: {app: invoice-service}
  template:
    metadata:
      labels: {app: invoice-service}
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: billing-db, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: billing-db, key: password}
