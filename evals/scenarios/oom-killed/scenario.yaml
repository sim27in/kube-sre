namespace: analytics
summary: The process allocates ~100MB under a 32Mi memory limit.
wait:
  - container_reason: OOMKilled
  - restarts: 2
incidents:
  - workload: report-builder
    kind: Deployment
    categories: [oom_killed]
    needs_spec: true
    root_cause: >-
      The container allocates about 100MB at startup but the Deployment sets a 32Mi memory limit,
      so it is OOMKilled (exit code 137) and crash-loops.
    key_facts:
      - the container is OOMKilled for exceeding its memory limit
      - the memory limit is 32Mi, below what the process needs
    fixes:
      - raise the memory limit well above 100MB (e.g. 256Mi) with kubectl set resources
      - or reduce the process's memory use
