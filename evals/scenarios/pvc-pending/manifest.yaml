apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inventory-db
spec:
  serviceName: inventory-db
  replicas: 1
  selector:
    matchLabels: {app: inventory-db}
  template:
    metadata:
      labels: {app: inventory-db}
    spec:
      containers:
        - name: db
          image: nginx:1.27-alpine
          volumeMounts:
            - {name: data, mountPath: /var/lib/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: fast-ssd
        resources:
          requests: {storage: 1Gi}
