apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
spec:
  hard:
    requests.memory: 1Gi
    limits.memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-renderer
spec:
  replicas: 1
  selector:
    matchLabels: {app: pdf-renderer}
  template:
    metadata:
      labels: {app: pdf-renderer}
    spec:
      containers:
        - name: renderer
          image: nginx:1.27-alpine
          resources:
            requests: {memory: 256Mi}
            limits: {memory: 2Gi}
