apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: profile-web}
  template:
    metadata:
      labels: {app: profile-web}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            periodSeconds: 3
