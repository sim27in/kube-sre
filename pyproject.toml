[project]
name = "kube-sre"
version = "0.1.0"
description = "Alert-driven multi-agent SRE system for Kubernetes"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "en-core-web-sm",
    "fastmcp>=3.4.7",
    "kubernetes>=36.0.3",
    "langchain>=1.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.12",
    "presidio-analyzer>=2.2.364",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kube_sre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not kind'"
markers = [
    "kind: integration tests that need a running kind cluster",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["baselines"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
